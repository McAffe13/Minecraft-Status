<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Status</title>
  <meta name="description" content="Live-Status deiner Minecraft-Server.">
  <meta name="theme-color" content="#0f1115">
  <link id="favicon" rel="icon" href="config/assets/favicon.svg" type="image/svg+xml">

  <!-- Basis-Layout. Designs (config/themes/*.css) und Einstellungen (config/config.js) werden aus dem config-Ordner geladen. -->
  <link rel="stylesheet" href="assets/css/base.css">
  <noscript><style>html:not([data-ready]) body { opacity: 1 !important; }</style></noscript>
</head>
<body>
  <div id="bg-custom" class="bg-custom" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span id="brand-logo" class="brand-logo" aria-hidden="true"></span>
        <div class="brand-text">
          <h1 id="site-title">Minecraft Status</h1>
          <p id="site-subtitle" class="muted"></p>
        </div>
      </div>

      <div class="header-actions">
        <nav id="header-links" class="header-links" aria-label="Links" hidden></nav>

        <div id="theme-switcher" class="theme-switcher" role="group" aria-label="Design wählen" hidden>
          <span class="theme-switcher-label muted">Design</span>
          <div id="theme-buttons" class="theme-buttons"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">
    <section id="summary" class="summary" data-state="loading" aria-live="polite">
      <span class="summary-dot" aria-hidden="true"></span>
      <div class="summary-text">
        <strong id="summary-title" class="summary-title">Lade Status …</strong>
        <span id="summary-detail" class="summary-detail muted"></span>
      </div>
      <button id="refresh" class="btn" type="button">Aktualisieren</button>
    </section>

    <section id="servers" class="servers" aria-label="Server"></section>

    <p id="demo-note" class="demo-note" hidden>
      Demo-Modus aktiv: Es werden Beispieldaten angezeigt, keine echten Server abgefragt.
    </p>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p id="footer-text" class="muted" hidden></p>
      <p class="muted">
        Daten via <span id="data-source"></span> ·
        <span id="last-updated">noch nicht aktualisiert</span> ·
        <a href="https://github.com/McAffe13/Minecraft-Status" rel="noopener">Quellcode auf GitHub</a>
      </p>
    </div>
  </footer>

  <noscript>
    <p class="wrap">Diese Seite benötigt JavaScript, um den Server-Status zu laden.</p>
  </noscript>

  <script src="config/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
